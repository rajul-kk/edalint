# The CircuitNet-N14 readers under native/: the Rust package (lint, build, tests) and the parity tests of every
# reader against edalint's stream_tarball. Synthetic tarballs only; the real-data test skips without the dataset.
name: n14io
on:
  push:
    paths: ["native/n14io/**", "native/n14io-rs/**", "src/edalint/datasets/circuitnet.py", ".github/workflows/n14io.yml"]
  pull_request:
    paths: ["native/n14io/**", "native/n14io-rs/**", "src/edalint/datasets/circuitnet.py", ".github/workflows/n14io.yml"]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: native/n14io-rs}}
    steps:
      - uses: actions/checkout@v4
      # rustup reads native/n14io-rs/rust-toolchain.toml and installs the pinned compiler, rustfmt and clippy
      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e . pytest rapidgzip isal
      - name: C++ reader where zlib headers exist, else the pure-Python one
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then export EDALINT_N14IO_PURE=1; fi
          python -m pip install pybind11 && python -m pip install --no-build-isolation -e native/n14io
      - run: python -m pip install ./native/n14io-rs
      - name: readers agree with edalint (python, native where built, rust)
        run: python -c "import edalint_n14io as n; assert n.HAVE_RUST; print('native', n.HAVE_NATIVE, 'inflate', n.INFLATE)"
      - run: python -m pytest native/n14io/tests -q
